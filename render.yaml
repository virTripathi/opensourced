# ==============================================================================
# OpenSourced Orchestrator — Render Blueprint (render.yaml)
# Automated deployment configuration for Render Free Web Service (Ephemeral SQLite)
# ==============================================================================

services:
  - type: web
    name: opensourced-backend
    runtime: node
    plan: free
    region: oregon
    healthCheckPath: /api/auth/providers
    buildCommand: npm ci --include=dev && npm --workspace=@opensourced/backend run prisma:generate && npx turbo run build
    startCommand: npm --workspace=@opensourced/backend run prisma:deploy && node apps/backend/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: DATABASE_TYPE
        value: sqlite
      - key: DATABASE_URL
        value: file:/tmp/opensourced.db
      - key: APP_URL
        sync: false # Set to your https://<service-name>.onrender.com URL
      - key: ENCRYPTION_KEY
        generateValue: true # Render automatically generates a cryptographically secure key
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a secure JWT signing secret
      - key: GITHUB_APP_NAME
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false # Set to https://<service-name>.onrender.com/api/auth/github/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false # Set to https://<service-name>.onrender.com/api/auth/google/callback
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: RANKING_PROVIDER
        value: gemini
